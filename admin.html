<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | SafeFlame AI</title>
<link rel="icon" type="image/png" href="Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --flame: #FF6B35;
    --flame-light: #FF9F70;
    --teal: #4ECDC4;
    --dark: #1A1A2E;
    --darker: #0F0F1E;
    --off-white: #F7F7F2;
    --muted: #8D8D8D;
    --surface: #22223B;
    --surface2: #2A2A42;
    --border: rgba(255,107,53,0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--darker);
    color: var(--off-white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 2.5rem;
    background: var(--dark);
    border-bottom: 1px solid var(--border);
  }

  header .brand {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    color: var(--flame);
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  header .brand img { height: 28px; width: auto; border-radius: 6px; }

  #logoutBtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
  }
  #logoutBtn:hover { color: var(--flame); border-color: var(--flame); }

  main { padding: 2.5rem; max-width: 1200px; margin: 0 auto; }

  /* ─── LOGIN GATE ─────────────────────────────────── */
  #loginScreen {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2.5rem;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .login-card h2 {
    font-family: 'Rajdhani', sans-serif;
    margin-bottom: 1.5rem;
    color: var(--off-white);
  }

  .login-card input {
    width: 100%;
    padding: 0.8rem 1rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--off-white);
    font-size: 0.95rem;
    outline: none;
    margin-bottom: 1rem;
  }

  .login-card input:focus { border-color: var(--flame); }

  .login-card button {
    width: 100%;
    background: var(--flame);
    color: #fff;
    border: none;
    padding: 0.8rem;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }

  .login-card button:hover { background: #e55a2b; }

  .login-error {
    color: var(--flame-light);
    font-size: 0.82rem;
    margin-top: 0.8rem;
    min-height: 1.2em;
  }

  /* ─── DASHBOARD ──────────────────────────────────── */
  #dashboard { display: none; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem 1.4rem;
  }

  .stat-card .num {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--flame);
  }

  .stat-card .label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 0.2rem;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.8rem;
    margin-bottom: 2rem;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
    gap: 0.8rem;
  }

  .panel-header h2 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.3rem;
    color: var(--off-white);
  }

  .panel-actions { display: flex; gap: 0.6rem; }

  .btn-small {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--off-white);
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .btn-small:hover { border-color: var(--teal); color: var(--teal); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  thead th {
    text-align: left;
    color: var(--teal);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-size: 0.72rem;
    padding: 0.7rem 0.8rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 0.7rem 0.8rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: #d0d0e0;
    vertical-align: top;
  }

  tbody tr:hover { background: rgba(255,107,53,0.05); }

  .status-pill {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 50px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    background: rgba(255,107,53,0.15);
    color: var(--flame-light);
  }

  .empty-state {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 1.5rem 0;
    text-align: center;
  }

  .table-scroll { overflow-x: auto; }

  @media (max-width: 700px) {
    header { padding: 1rem 1.2rem; }
    main { padding: 1.5rem 1rem; }
    .panel { padding: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="Logo.png" alt="SafeFlame AI Logo">
    SafeFlame AI Admin
  </div>
  <button id="logoutBtn" style="display:none;">Log Out</button>
</header>

<main>
  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>Admin Login</h2>
      <input type="password" id="adminPassword" placeholder="Enter admin password" autocomplete="current-password">
      <button id="loginBtn">Log In</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="stats-row">
      <div class="stat-card">
        <div class="num" id="prebookCount">0</div>
        <div class="label">Pre-Bookings</div>
      </div>
      <div class="stat-card">
        <div class="num" id="unitsCount">0</div>
        <div class="label">Units Ordered</div>
      </div>
      <div class="stat-card">
        <div class="num" id="waitlistCount">0</div>
        <div class="label">Waitlist Signups</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Pre-Bookings (Orders)</h2>
        <div class="panel-actions">
          <button class="btn-small" id="refreshPrebooks">Refresh</button>
          <button class="btn-small" id="exportPrebooks">Export CSV</button>
        </div>
      </div>
      <div class="table-scroll">
        <table id="prebookTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Qty</th>
              <th>Address</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="empty-state" id="prebookEmpty" style="display:none;">No pre-bookings yet.</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Waitlist Signups</h2>
        <div class="panel-actions">
          <button class="btn-small" id="refreshWaitlist">Refresh</button>
          <button class="btn-small" id="exportWaitlist">Export CSV</button>
        </div>
      </div>
      <div class="table-scroll">
        <table id="waitlistTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="empty-state" id="waitlistEmpty" style="display:none;">No waitlist signups yet.</div>
      </div>
    </div>
  </div>
</main>

<!-- ─── FIREBASE ────────────────────────────────────── -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDg2MoKPdixAad2KJy2EFGEBDUVa2y0xwg",
    authDomain: "safeflame-booking.firebaseapp.com",
    projectId: "safeflame-booking",
    storageBucket: "safeflame-booking.firebasestorage.app",
    messagingSenderId: "374272302404",
    appId: "1:374272302404:web:3a634dd7fef87d1b17cb11",
    measurementId: "G-KG999L8388"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ─────────────────────────────────────────────────
  // CHANGE THIS PASSWORD before publishing the site.
  // This is a simple client-side gate only — see the
  // security note provided alongside this file.
  // ─────────────────────────────────────────────────
  const ADMIN_PASSWORD = "admin123";

  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const adminPasswordInput = document.getElementById('adminPassword');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');

  function showDashboard() {
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
    loadPrebookings();
    loadWaitlist();
  }

  function attemptLogin() {
    if (adminPasswordInput.value === ADMIN_PASSWORD) {
      sessionStorage.setItem('sf_admin_ok', '1');
      loginError.textContent = '';
      showDashboard();
    } else {
      loginError.textContent = 'Incorrect password.';
    }
  }

  loginBtn.addEventListener('click', attemptLogin);
  adminPasswordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptLogin();
  });

  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem('sf_admin_ok');
    location.reload();
  });

  if (sessionStorage.getItem('sf_admin_ok') === '1') {
    showDashboard();
  }

  // ─── Helpers ───────────────────────────────────────
  function formatDate(ts) {
    if (!ts || !ts.toDate) return '—';
    return ts.toDate().toLocaleString();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function downloadCsv(filename, rows) {
    const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }

  // ─── Pre-Bookings ──────────────────────────────────
  let prebookData = [];

  async function loadPrebookings() {
    const tbody = document.querySelector('#prebookTable tbody');
    const emptyState = document.getElementById('prebookEmpty');
    tbody.innerHTML = '<tr><td colspan="7">Loading…</td></tr>';

    try {
      const snapshot = await db.collection('preBookings').orderBy('createdAt', 'desc').get();
      prebookData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      tbody.innerHTML = '';
      let totalUnits = 0;

      if (prebookData.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        prebookData.forEach(order => {
          totalUnits += Number(order.quantity) || 0;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${formatDate(order.createdAt)}</td>
            <td>${escapeHtml(order.name)}</td>
            <td>${escapeHtml(order.email)}</td>
            <td>${escapeHtml(order.phone)}</td>
            <td>${escapeHtml(order.quantity)}</td>
            <td>${escapeHtml(order.address)}</td>
            <td><span class="status-pill">${escapeHtml(order.status || 'pending')}</span></td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('prebookCount').textContent = prebookData.length;
      document.getElementById('unitsCount').textContent = totalUnits;
    } catch (err) {
      console.error('Failed to load pre-bookings:', err);
      tbody.innerHTML = '<tr><td colspan="7">Failed to load data. Check console for details.</td></tr>';
    }
  }

  document.getElementById('refreshPrebooks').addEventListener('click', loadPrebookings);
  document.getElementById('exportPrebooks').addEventListener('click', () => {
    const rows = [['Date', 'Name', 'Email', 'Phone', 'Quantity', 'Address', 'Status']];
    prebookData.forEach(o => rows.push([formatDate(o.createdAt), o.name, o.email, o.phone, o.quantity, o.address, o.status || 'pending']));
    downloadCsv('safeflame-prebookings.csv', rows);
  });

  // ─── Waitlist ──────────────────────────────────────
  let waitlistData = [];

  async function loadWaitlist() {
    const tbody = document.querySelector('#waitlistTable tbody');
    const emptyState = document.getElementById('waitlistEmpty');
    tbody.innerHTML = '<tr><td colspan="2">Loading…</td></tr>';

    try {
      const snapshot = await db.collection('waitlist').orderBy('createdAt', 'desc').get();
      waitlistData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      tbody.innerHTML = '';

      if (waitlistData.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        waitlistData.forEach(entry => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${formatDate(entry.createdAt)}</td>
            <td>${escapeHtml(entry.email)}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('waitlistCount').textContent = waitlistData.length;
    } catch (err) {
      console.error('Failed to load waitlist:', err);
      tbody.innerHTML = '<tr><td colspan="2">Failed to load data. Check console for details.</td></tr>';
    }
  }

  document.getElementById('refreshWaitlist').addEventListener('click', loadWaitlist);
  document.getElementById('exportWaitlist').addEventListener('click', () => {
    const rows = [['Date', 'Email']];
    waitlistData.forEach(w => rows.push([formatDate(w.createdAt), w.email]));
    downloadCsv('safeflame-waitlist.csv', rows);
  });
</script>
</body>
</html>
