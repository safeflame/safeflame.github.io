    verifyEmail: { ...DEFAULT_SETTINGS.verifyEmail, ...(data.verifyEmail || {}) }

}
async function loadSiteSettings() {
  try { const d = await db.collection('settings').doc('site').get(); if (d.exists) siteSettings = mergeSettings(d.data()); }

/* ── helpers ── */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const isValidEmail = e => EMAIL_RE.test(String(e).trim());
const sanitize = s => String(s || '').replace(/<[^>]*>/g, '').replace(/[<>"'`]/g, '').trim();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const tierPriceFor = t => Number(t === 'elite' ? siteSettings.elitePrice : t === 'pro' ? siteSettings.proPrice : siteSettings.basePrice);
const tierLabelFor = t => t === 'elite' ? '9" Elite' : t === 'pro' ? '7" Pro' : '4" Base';
const fmtINR = n => '₹' + Number(n).toLocaleString('en-IN');
function orderNumberFor(o) {
  if (o.orderNumber) return String(o.orderNumber);
  if (!o.id) return '000000';
  let h = 0; for (let i = 0; i < o.id.length; i++) h = (h * 31 + o.id.charCodeAt(i)) >>> 0;
  return String(100000 + (h % 900000));
}
async function getNextOrderNumber() {
  const ref = db.collection('settings').doc('orderCounter');
  try {
    return await db.runTransaction(async tx => {
      const d = await tx.get(ref);
      const next = d.exists ? (Number(d.data().lastNumber) || 0) + 1 : (Number(siteSettings.orderNumberStart) || 100000);
      tx.set(ref, { lastNumber: next }, { merge: true });
      return next;
    });
  } catch (e) { return Math.floor(100000 + Math.random() * 900000); }
}
/* redirect helper with a loop breaker (stops runaway reload loops instead of freezing the browser) */
function showFatal(msg) {

  d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#08080f;color:#f0f0f8;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;font-family:Inter,system-ui,sans-serif';
  d.innerHTML = '<div><h2 style="margin-bottom:.6rem">Something went wrong</h2><p style="color:#a0a0b8;max-width:420px;margin:0 auto 1.2rem">' + msg + '</p><a href="/" style="color:#ff8a65">Back to home</a></div>';
  document.body.appendChild(d);
}
function go(url) {
  try {
    const now = Date.now(), a = JSON.parse(sessionStorage.getItem('sf_nav') || '[]').filter(t => now - t < 8000);
    a.push(now); sessionStorage.setItem('sf_nav', JSON.stringify(a));
    if (a.length > 6) { sessionStorage.removeItem('sf_nav'); return showFatal('The page kept redirecting, so we stopped it. Please reload and try again.'); }
  } catch (_) {}
  location.href = url;
}
function qs(name) { return new URLSearchParams(location.search).get(name); }
/* only allow redirects to our own pages */
function safeNext(n) { return n && /^\/?[a-z0-9_-]*(\.html)?(\?[\w=&%.-]*)?$/i.test(n) ? n : null; }

/* ── EmailJS ── */
async function sendWithCfg(cfg, params) {
  cfg = cfg || {};
  const svc = cfg.serviceId || siteSettings.emailjsServiceId;
  const tpl = cfg.templateId || siteSettings.emailjsTemplateId;
  const key = cfg.publicKey || siteSettings.emailjsPublicKey;
  if (!svc || !tpl || !key) throw new Error('EMAILJS_NOT_CONFIGURED');
  return emailjs.send(svc, tpl, params, { publicKey: key });
}
async function sendOtpEmail(email, name, otp) {
  const cfg = siteSettings.otpEmail;
  const tokens = { name: name || 'there', otp, email };
  return sendWithCfg(cfg, { to_email: email, to_name: name || 'there', name: name || 'there', email, otp, subject: renderTokens(cfg.subject, tokens), message: renderTokens(cfg.message, tokens), order_id: '' });
}
async function sendVerifyEmail(email, name, link) {
  const cfg = siteSettings.verifyEmail;
  const tokens = { name: name || 'there', email, link };
  return sendWithCfg(cfg, { to_email: email, to_name: name || 'there', name: name || 'there', email, link, subject: renderTokens(cfg.subject, tokens), message: renderTokens(cfg.message, tokens), order_id: '' });
}
function sendOrderConfirmationEmail(order) {
  if (!order.email) return;
  const cfg = (siteSettings.statusEmails && siteSettings.statusEmails.pending) || DEFAULT_SETTINGS.statusEmails.pending;
  const tierLabel = tierLabelFor(order.tier), qty = Number(order.quantity) || 1, unit = order.unitPrice, total = unit * qty;
  const t = { name: order.name || 'there', order_id: orderNumberFor(order), tier: tierLabel, quantity: qty, unit_price: fmtINR(unit), total_price: fmtINR(total), status: 'Pending', phone: order.phone || '' };
  sendWithCfg(cfg, {
    to_email: order.email, to_name: t.name, subject: renderTokens(cfg.subject, t), email: order.email, order_id: t.order_id,
    orders: [{ name: 'SafeFlame AI — ' + tierLabel, units: qty, price: total.toLocaleString('en-IN') }],
    cost: { shipping: '0', tax: '0', total: total.toLocaleString('en-IN') },
    product_name: 'SafeFlame AI — ' + tierLabel, tier: tierLabel, quantity: qty, unit_price: t.unit_price, total_price: t.total_price,
    status: 'pending', phone: t.phone, message: renderTokens(cfg.message, t)
  }).catch(e => console.warn('Confirmation email failed:', e));
}

/* ── Gemini (used by chat page) ── */
function getGeminiKeys() {
  let k = Array.isArray(siteSettings.geminiApiKeys) ? siteSettings.geminiApiKeys.filter(Boolean) : [];
  if (!k.length && siteSettings.geminiApiKey) k = [siteSettings.geminiApiKey];
  return k;
}
async function callGemini(system, history) {
  const keys = getGeminiKeys(), model = siteSettings.geminiModel || 'gemini-3.5-flash';
  if (!keys.length) throw new Error('No Gemini keys configured.');
  let lastErr = null;
  for (const key of keys) {
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: history })
      });
      if (!r.ok) { lastErr = new Error('Status ' + r.status); continue; }
      const d = await r.json();
      const reply = d?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!reply) { lastErr = new Error('Empty reply'); continue; }
      return reply;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('All keys failed.');
}

/* ── verification state ── */
async function isVerified(user) {
  if (!user) return false;
  if (isAdminEmail(user.email)) return true; // admin accounts skip email verification
  if (user.emailVerified) return true;
  const isPasswordUser = user.providerData.some(p => p.providerId === 'password');
  if (!isPasswordUser) return true; // Google etc.
  try {
    const ud = await db.collection('users').doc(user.uid).get();
    if (ud.exists && ud.data().emailVerified === true) return true;
    const q = await db.collection('emailVerifications').where('uid', '==', user.uid).where('verified', '==', true).limit(1).get();
    if (!q.empty) {
      await db.collection('users').doc(user.uid).set({ emailVerified: true }, { merge: true });
      q.docs.forEach(d => d.ref.delete().catch(() => {}));
      return true;
    }
  } catch (e) { console.warn('verify check failed', e); }
  return false;
}
function randomToken() { const a = new Uint8Array(32); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); }
async function createAndSendVerification(user, name) {
  const token = randomToken();
  await db.collection('emailVerifications').doc(token).set({ uid: user.uid, email: user.email, verified: false, createdAt: TS(), expiresAt: Date.now() + 24 * 3600 * 1000 });
  const base = location.origin;
  const link = base + '/verify?token=' + token;
  try { await sendVerifyEmail(user.email, name, link); return 'emailjs'; }
  catch (e) {
    if (e.message !== 'EMAILJS_NOT_CONFIGURED') throw e;
    await user.sendEmailVerification({ url: base + '/verify?native=1' }); // fallback: Firebase's own mail
    return 'firebase';
  }
}

}

/* ── A) arrived from the link in the email ── */
async function handleToken() {
  setView('<svg class="ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2a8.8 8.8 0 0 1 8.8 8.8" stroke-width="2"><animateTransform attributeName="transform" type="rotate" values="0 12 12;360 12 12" dur="1.4s" repeatCount="indefinite"></animateTransform></path><path d="M12 19a7 7 0 0 1-7-7" stroke-width="2" stroke-opacity=".55"><animateTransform attributeName="transform" type="rotate" values="360 12 12;0 12 12" dur="1.05s" repeatCount="indefinite"></animateTransform></path></svg>', 'Verifying your email…', 'One moment.');
  try {

    if (!snap.exists) return setView('<svg class="ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.8 19.5h18.4L12 4Z"/><path d="M12 10v4.2M12 17h.01"/></svg>', 'Link invalid or already used', 'Sign in — if your account is already verified you will go straight through. Otherwise request a new link.', '<a class="btn-primary" href="/login">Go to sign in</a>');

/* ── B) "check your inbox" waiting page ── */
let pollTimer = null;
async function pending(user) {
  const failed = sessionStorage.getItem('sf_verify_send_failed');
  setView('<svg class="ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 3.2H5.8a2 2 0 0 0-2 2V7M16.4 3.2h1.8a2 2 0 0 1 2 2V7M7.6 20.8H5.8a2 2 0 0 1-2-2V17M16.4 20.8h1.8a2 2 0 0 0 2-2V17"></path><path d="M3.8 12h16.4" stroke-width="1.9"><animateTransform attributeName="transform" type="translate" values="0 -5;0 5;0 -5" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.2 1;0.45 0 0.2 1"></animateTransform><animate attributeName="opacity" values=".3;1;.3;1;.3" keyTimes="0;0.25;0.5;0.75;1" dur="2.6s" repeatCount="indefinite"></animate></path></svg>', 'Check your email', 'We sent a verification link to <strong>' + esc(user.email) + '</strong>. Click it to activate your account — this page continues automatically.',
    '<button class="btn-primary btn-block" id="checkBtn" type="button">I\'ve verified — continue</button>' +

  };
