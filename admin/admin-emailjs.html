<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmailJS | SafeFlame AI Admin</title>
<link rel="icon" type="image/png" href="/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --flame: #FF6B35;
    --flame-light: #FF9F70;
    --teal: #4ECDC4;
    --dark: #1A1A2E;
    --darker: #0F0F1E;
    --off-white: #F7F7F2;
    --muted: #A0A0B8;
    --surface: #22223B;
    --surface2: #2A2A42;
    --surface3: #32324E;
    --border: rgba(255,107,53,0.18);
    --green: #4ECD8C;
    --yellow: #E8C547;
    --red: #E85D5D;
    --radius: 10px;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--darker);
    background-image: radial-gradient(circle at 15% 0%, rgba(255,107,53,0.06), transparent 40%),
                       radial-gradient(circle at 85% 20%, rgba(78,205,196,0.05), transparent 40%);
    color: var(--off-white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    background: var(--dark);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 60;
  }

  header .brand {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    color: var(--flame);
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  header .brand img { height: 26px; width: auto; border-radius: 6px; }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.68rem;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-left: 0.8rem;
    background: rgba(78,205,140,0.1);
    padding: 0.25rem 0.6rem;
    border-radius: 50px;
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(78,205,140,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(78,205,140,0); }
  }

  #logoutBtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s ease;
  }
  #logoutBtn:hover { color: var(--flame); border-color: var(--flame); }

  /* ─── TAB NAV ────────────────────────────────────── */
  .tab-nav {
    display: flex;
    gap: 0.3rem;
    background: var(--dark);
    padding: 0 2rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 61px;
    z-index: 55;
    overflow-x: auto;
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    padding: 0.9rem 1.1rem;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .tab-btn:hover { color: var(--off-white); }
  .tab-btn.active { color: var(--flame); border-bottom-color: var(--flame); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  main { padding: 2rem; max-width: 1300px; margin: 0 auto; }

  /* ─── LOGIN GATE ─────────────────────────────────── */
  /* ─── LOGIN SCREEN ───────────────────────────────── */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .login-ambient {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 50% at 15% 10%, rgba(255,107,53,0.13), transparent 60%),
      radial-gradient(ellipse 60% 45% at 85% 80%, rgba(78,205,196,0.09), transparent 55%),
      radial-gradient(ellipse 50% 40% at 60% 30%, rgba(255,107,53,0.06), transparent 50%);
  }

  .login-ambient::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.018) 1px, transparent 0);
    background-size: 36px 36px;
  }

  .login-card {
    position: relative;
    z-index: 2;
    background: rgba(34,34,59,0.7);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 2.8rem 2.4rem;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    animation: loginFadeUp 0.5s ease forwards;
  }

  @keyframes loginFadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
  }
  .brand-mark img { height: 34px; border-radius: 9px; }
  .brand-mark span {
    font-family: 'Space Grotesk', 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--off-white);
  }
  .brand-mark span em {
    font-style: normal;
    color: var(--flame);
  }

  .login-subtitle {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 2rem;
    letter-spacing: 0.03em;
  }

  /* Google button */
  .google-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--off-white);
    padding: 0.8rem 1rem;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    font-family: 'Inter', sans-serif;
    margin-bottom: 1.2rem;
  }
  .google-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }
  .google-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .login-divider {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
    color: var(--muted);
    font-size: 0.75rem;
  }
  .login-divider::before,
  .login-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .login-field { margin-bottom: 1rem; }
  .login-field input {
    width: 100%;
    padding: 0.85rem 1.1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--off-white);
    font-size: 0.92rem;
    outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .login-field input:focus { border-color: var(--flame); background: rgba(255,107,53,0.05); }

  .login-btn {
    width: 100%;
    background: var(--flame);
    color: #fff;
    border: none;
    padding: 0.88rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .login-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-20deg);
    transition: left 0.5s ease;
  }
  .login-btn:hover::after { left: 130%; }
  .login-btn:hover { background: #e55a2b; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255,107,53,0.35); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

  .login-error {
    color: var(--flame-light);
    font-size: 0.8rem;
    margin-top: 0.9rem;
    min-height: 1.2em;
    line-height: 1.5;
  }

  .login-note {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 1.4rem;
    opacity: 0.7;
    line-height: 1.5;
  }

  /* ─── DASHBOARD ──────────────────────────────────── */
  #dashboard { display: none; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem;
    margin-bottom: 1.8rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.3rem 1.4rem;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: rgba(255,107,53,0.4); }

  .stat-card .num {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--flame);
  }

  .stat-card.mini .num { font-size: 1.4rem; }
  .stat-card.mini.pending .num { color: var(--yellow); }
  .stat-card.mini.confirmed .num { color: var(--teal); }
  .stat-card.mini.shipped .num { color: var(--green); }
  .stat-card.mini.cancelled .num { color: var(--red); }

  .stat-card .label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 0.3rem;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.8rem;
    margin-bottom: 1.8rem;
    box-shadow: var(--shadow);
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.3rem;
    flex-wrap: wrap;
    gap: 0.8rem;
  }

  .panel-header h2 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.25rem;
    color: var(--off-white);
    display: flex;
    align-items: center;
  }

  .panel-subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }

  .panel-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

  .btn-small {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--off-white);
    padding: 0.5rem 1rem;
    border-radius: 7px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-small:hover { border-color: var(--teal); color: var(--teal); transform: translateY(-1px); }
  .btn-small.danger:hover { border-color: var(--red); color: var(--red); }
  .btn-small.primary { background: var(--flame); border-color: var(--flame); color: #fff; }
  .btn-small.primary:hover { background: #e55a2b; color: #fff; }

  .search-input, .filter-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--off-white);
    padding: 0.5rem 0.9rem;
    border-radius: 7px;
    font-size: 0.8rem;
    outline: none;
  }
  .search-input:focus, .filter-select:focus { border-color: var(--flame); }
  .search-input { min-width: 180px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
  }

  thead th {
    text-align: left;
    color: var(--teal);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-size: 0.7rem;
    padding: 0.75rem 0.8rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 0.75rem 0.8rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: #d0d0e0;
    vertical-align: top;
  }

  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: rgba(255,107,53,0.05); }

  .tier-pill {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 50px;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .tier-pill.base { background: rgba(78,205,196,0.15); color: var(--teal); }
  .tier-pill.pro { background: rgba(255,107,53,0.15); color: var(--flame-light); }
  .tier-pill.elite { background: rgba(232,197,71,0.18); color: var(--yellow); }

  .status-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--off-white);
    padding: 0.3rem 0.5rem;
    border-radius: 50px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    outline: none;
  }

  .status-select.pending { color: var(--yellow); border-color: var(--yellow); }
  .status-select.confirmed { color: var(--teal); border-color: var(--teal); }
  .status-select.shipped { color: var(--green); border-color: var(--green); }
  .status-select.cancelled { color: var(--red); border-color: var(--red); }

  .row-delete {
    background: none;
    border: 1px solid rgba(232,93,93,0.3);
    color: var(--red);
    padding: 0.35rem 0.7rem;
    border-radius: 6px;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .row-delete:hover { background: rgba(232,93,93,0.15); }

  .empty-state {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 2rem 0;
    text-align: center;
  }

  .table-scroll { overflow-x: auto; }

  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }

  .chart-box { background: var(--surface2); border-radius: 8px; padding: 1.1rem; }
  .chart-box h3 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.92rem;
    color: var(--off-white);
    margin-bottom: 0.8rem;
    font-weight: 600;
  }

  /* ─── BULK ACTIONS ───────────────────────────────── */
  .bulk-bar {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    background: rgba(255,107,53,0.08);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    margin-bottom: 1rem;
    font-size: 0.82rem;
    flex-wrap: wrap;
  }
  #bulkCount { color: var(--flame-light); font-weight: 600; }

  /* ─── SORTABLE HEADERS ───────────────────────────── */
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--flame-light); }
  .sort-arrow { display: inline-block; width: 10px; }
  th.sortable.sort-asc .sort-arrow::after { content: '▲'; font-size: 0.6rem; }
  th.sortable.sort-desc .sort-arrow::after { content: '▼'; font-size: 0.6rem; }

  /* ─── NOTES INPUT ────────────────────────────────── */
  .notes-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--off-white);
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    font-size: 0.8rem;
    width: 130px;
    outline: none;
    font-family: 'Inter', sans-serif;
  }
  .notes-input:focus { border-color: var(--teal); }

  /* ─── SETTINGS FORM ──────────────────────────────── */
  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.6rem;
  }

  .settings-group {
    background: var(--surface2);
    border-radius: 8px;
    padding: 1.3rem;
  }

  .settings-group h3 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    color: var(--teal);
    margin-bottom: 1rem;
    font-weight: 600;
  }

  .field { margin-bottom: 0.9rem; }
  .field label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field input, .field textarea {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface3);
    color: var(--off-white);
    font-size: 0.85rem;
    outline: none;
    font-family: 'Inter', sans-serif;
  }
  .field input:focus, .field textarea:focus { border-color: var(--flame); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field-hint { font-size: 0.7rem; color: var(--muted); margin-top: 0.3rem; opacity: 0.8; }

  .key-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    align-items: center;
  }
  .key-row input {
    flex: 1;
    padding: 0.55rem 0.7rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface3);
    color: var(--off-white);
    font-size: 0.82rem;
    outline: none;
  }
  .key-row input:focus { border-color: var(--flame); }
  .key-row .remove-key-btn {
    background: none;
    border: 1px solid rgba(232,93,93,0.3);
    color: var(--red);
    width: 30px;
    height: 30px;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .key-row .remove-key-btn:hover { background: rgba(232,93,93,0.15); }

  .settings-save-bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 1.6rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--border);
  }

  #settingsSavedNote { font-size: 0.8rem; color: var(--green); opacity: 0; transition: opacity 0.3s ease; }

  .security-note {
    background: rgba(232,93,93,0.08);
    border: 1px solid rgba(232,93,93,0.25);
    border-radius: 8px;
    padding: 0.9rem 1.1rem;
    font-size: 0.78rem;
    color: #f0b8b8;
    margin-bottom: 1.4rem;
    line-height: 1.5;
  }

  /* ─── TOASTS ─────────────────────────────────────── */
  #toastContainer {
    position: fixed;
    bottom: 1.5rem;
    left: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    z-index: 999;
  }

  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--teal);
    color: var(--off-white);
    padding: 0.8rem 1.2rem;
    border-radius: 6px;
    font-size: 0.85rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    animation: toastIn 0.25s ease;
    max-width: 320px;
  }
  .toast.error { border-left-color: var(--red); }
  .toast.success { border-left-color: var(--green); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── AI CHATBOT WIDGET ──────────────────────────── */
  .chat-toggle {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--flame), #e55a2b);
    border: none;

<script>
/* SafeFlame AI — shared JS (Firebase, settings, helpers, email). Load AFTER firebase + emailjs scripts. */
const firebaseConfig = {

};
/* The admin pages set window.SF_APP_NAME = 'admin' so the admin login lives in its own Firebase app and never signs anyone in on the public site. */
const _fbApp = window.SF_APP_NAME
  ? (firebase.apps.find(a => a.name === window.SF_APP_NAME) || firebase.initializeApp(firebaseConfig, window.SF_APP_NAME))
  : (firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig));
const ADMIN_EMAILS = ['admin@safeflame.github.io', 'chrisbenmartink24@gmail.com'];
const isAdminEmail = e => ADMIN_EMAILS.includes(String(e || '').toLowerCase());
const db = _fbApp.firestore();
try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (_) {} // avoids long hangs on networks that block Firestore streaming
const auth = _fbApp.auth();
const TS = () => firebase.firestore.FieldValue.serverTimestamp();

/* ── DEFAULT SETTINGS (same shape the admin saves to settings/site) ── */
const DEFAULT_SETTINGS = {
  launchDate: '2026-12-01T00:00',
  basePrice: 24999, baseOriginalPrice: 29999, proPrice: 39999, proOriginalPrice: 46999, elitePrice: 54999, eliteOriginalPrice: 64999,
  baseStock: -1, proStock: -1, eliteStock: -1, orderNumberStart: 100000,
  geminiApiKey: '', geminiApiKeys: [], geminiModel: 'gemini-3.5-flash',
  emailjsServiceId: '', emailjsTemplateId: '', emailjsPublicKey: '',
  statusEmails: {
    pending: { subject: "We've received your SafeFlame AI order", message: "Hi {{name}}, thanks for pre-booking! Your order {{order_id}} for {{tier}} (x{{quantity}}) is currently Pending — total {{total_price}}. We'll email you again once it's confirmed.", serviceId: '', templateId: '', publicKey: '' }
  },
  otpEmail: { subject: 'Your SafeFlame AI verification code', message: 'Hi {{name}}, your SafeFlame AI verification code is {{otp}}. It expires in 10 minutes. Never share this code with anyone.', serviceId: '', templateId: '', publicKey: '' },
  verifyEmail: { subject: 'Verify your SafeFlame AI account', message: 'Hi {{name}}, welcome to SafeFlame AI! Please confirm your email address to activate your account: {{link}}', serviceId: '', templateId: '', publicKey: '' }
};
let siteSettings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
function mergeSettings(data) {
  data = data || {};
  return {
    ...DEFAULT_SETTINGS, ...data,
    statusEmails: { ...DEFAULT_SETTINGS.statusEmails, ...(data.statusEmails || {}) },
    otpEmail: { ...DEFAULT_SETTINGS.otpEmail, ...(data.otpEmail || {}) },
    verifyEmail: { ...DEFAULT_SETTINGS.verifyEmail, ...(data.verifyEmail || {}) }
  };
}
async function loadSiteSettings() {
  try { const d = await db.collection('settings').doc('site').get(); if (d.exists) siteSettings = mergeSettings(d.data()); }
  catch (e) { console.warn('Settings load failed, using defaults:', e); }
  return siteSettings;
}

/* ── helpers ── */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const isValidEmail = e => EMAIL_RE.test(String(e).trim());
const sanitize = s => String(s || '').replace(/<[^>]*>/g, '').replace(/[<>"'`]/g, '').trim();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const renderTokens = (str, t) => String(str || '').replace(/\{\{(\w+)\}\}/g, (m, k) => k in t ? t[k] : m);
const tierPriceFor = t => Number(t === 'elite' ? siteSettings.elitePrice : t === 'pro' ? siteSettings.proPrice : siteSettings.basePrice);
const tierLabelFor = t => t === 'elite' ? '9" Elite' : t === 'pro' ? '7" Pro' : '4" Base';
const fmtINR = n => '₹' + Number(n).toLocaleString('en-IN');
function orderNumberFor(o) {
  if (o.orderNumber) return String(o.orderNumber);
  if (!o.id) return '000000';
  let h = 0; for (let i = 0; i < o.id.length; i++) h = (h * 31 + o.id.charCodeAt(i)) >>> 0;
  return String(100000 + (h % 900000));
}
async function getNextOrderNumber() {
  const ref = db.collection('settings').doc('orderCounter');
  try {
    return await db.runTransaction(async tx => {
      const d = await tx.get(ref);
      const next = d.exists ? (Number(d.data().lastNumber) || 0) + 1 : (Number(siteSettings.orderNumberStart) || 100000);
      tx.set(ref, { lastNumber: next }, { merge: true });
      return next;
    });
  } catch (e) { return Math.floor(100000 + Math.random() * 900000); }
}
/* redirect helper with a loop breaker (stops runaway reload loops instead of freezing the browser) */
function showFatal(msg) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#08080f;color:#f0f0f8;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;font-family:Inter,system-ui,sans-serif';
  d.innerHTML = '<div><h2 style="margin-bottom:.6rem">Something went wrong</h2><p style="color:#a0a0b8;max-width:420px;margin:0 auto 1.2rem">' + msg + '</p><a href="/" style="color:#ff8a65">Back to home</a></div>';
  document.body.appendChild(d);
}
function go(url) {
  try {
    const now = Date.now(), a = JSON.parse(sessionStorage.getItem('sf_nav') || '[]').filter(t => now - t < 8000);
    a.push(now); sessionStorage.setItem('sf_nav', JSON.stringify(a));
    if (a.length > 6) { sessionStorage.removeItem('sf_nav'); return showFatal('The page kept redirecting, so we stopped it. Please reload and try again.'); }
  } catch (_) {}
  location.href = url;
}
function qs(name) { return new URLSearchParams(location.search).get(name); }
/* only allow redirects to our own pages */
function safeNext(n) { return n && /^\/?[a-z0-9_-]*(\.html)?(\?[\w=&%.-]*)?$/i.test(n) ? n : null; }

/* ── EmailJS ── */
async function sendWithCfg(cfg, params) {
  cfg = cfg || {};
  const svc = cfg.serviceId || siteSettings.emailjsServiceId;
  const tpl = cfg.templateId || siteSettings.emailjsTemplateId;
  const key = cfg.publicKey || siteSettings.emailjsPublicKey;
  if (!svc || !tpl || !key) throw new Error('EMAILJS_NOT_CONFIGURED');
  return emailjs.send(svc, tpl, params, { publicKey: key });
}
async function sendOtpEmail(email, name, otp) {
  const cfg = siteSettings.otpEmail;
  const tokens = { name: name || 'there', otp, email };
  return sendWithCfg(cfg, { to_email: email, to_name: name || 'there', name: name || 'there', email, otp, subject: renderTokens(cfg.subject, tokens), message: renderTokens(cfg.message, tokens), order_id: '' });
}
async function sendVerifyEmail(email, name, link) {
  const cfg = siteSettings.verifyEmail;
  const tokens = { name: name || 'there', email, link };
  return sendWithCfg(cfg, { to_email: email, to_name: name || 'there', name: name || 'there', email, link, subject: renderTokens(cfg.subject, tokens), message: renderTokens(cfg.message, tokens), order_id: '' });
}
function sendOrderConfirmationEmail(order) {
  if (!order.email) return;
  const cfg = (siteSettings.statusEmails && siteSettings.statusEmails.pending) || DEFAULT_SETTINGS.statusEmails.pending;
  const tierLabel = tierLabelFor(order.tier), qty = Number(order.quantity) || 1, unit = order.unitPrice, total = unit * qty;
  const t = { name: order.name || 'there', order_id: orderNumberFor(order), tier: tierLabel, quantity: qty, unit_price: fmtINR(unit), total_price: fmtINR(total), status: 'Pending', phone: order.phone || '' };
  sendWithCfg(cfg, {
    to_email: order.email, to_name: t.name, subject: renderTokens(cfg.subject, t), email: order.email, order_id: t.order_id,
    orders: [{ name: 'SafeFlame AI — ' + tierLabel, units: qty, price: total.toLocaleString('en-IN') }],
    cost: { shipping: '0', tax: '0', total: total.toLocaleString('en-IN') },
    product_name: 'SafeFlame AI — ' + tierLabel, tier: tierLabel, quantity: qty, unit_price: t.unit_price, total_price: t.total_price,
    status: 'pending', phone: t.phone, message: renderTokens(cfg.message, t)
  }).catch(e => console.warn('Confirmation email failed:', e));
}

/* ── Gemini (used by chat page) ── */
function getGeminiKeys() {
  let k = Array.isArray(siteSettings.geminiApiKeys) ? siteSettings.geminiApiKeys.filter(Boolean) : [];
  if (!k.length && siteSettings.geminiApiKey) k = [siteSettings.geminiApiKey];
  return k;
}
async function callGemini(system, history) {
  const keys = getGeminiKeys(), model = siteSettings.geminiModel || 'gemini-3.5-flash';
  if (!keys.length) throw new Error('No Gemini keys configured.');
  let lastErr = null;
  for (const key of keys) {
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: history })
      });
      if (!r.ok) { lastErr = new Error('Status ' + r.status); continue; }
      const d = await r.json();
      const reply = d?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!reply) { lastErr = new Error('Empty reply'); continue; }
      return reply;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('All keys failed.');
}

/* ── user appearance prefs (saved by account page) ── */
const USER_SETTINGS_KEY = 'sf_user_settings';
function getLocalPrefs() { try { return JSON.parse(localStorage.getItem(USER_SETTINGS_KEY) || '{}'); } catch (_) { return {}; } }
function applyAppearance(p) {
  p = p || getLocalPrefs();
  document.documentElement.style.fontSize = p.fontSize || '';
  document.documentElement.classList.toggle('reduce-motion', !!p.reduceMotion);
  document.documentElement.classList.toggle('compact-mode', !!p.compact);
}
applyAppearance();

/* ── verification state ── */
async function isVerified(user) {
  if (!user) return false;
  if (isAdminEmail(user.email)) return true; // admin accounts skip email verification
  if (user.emailVerified) return true;
  const isPasswordUser = user.providerData.some(p => p.providerId === 'password');
  if (!isPasswordUser) return true; // Google etc.
  try {
    const ud = await db.collection('users').doc(user.uid).get();
    if (ud.exists && ud.data().emailVerified === true) return true;
    const q = await db.collection('emailVerifications').where('uid', '==', user.uid).where('verified', '==', true).limit(1).get();
    if (!q.empty) {
      await db.collection('users').doc(user.uid).set({ emailVerified: true }, { merge: true });
      q.docs.forEach(d => d.ref.delete().catch(() => {}));
      return true;
    }
  } catch (e) { console.warn('verify check failed', e); }
  return false;
}
function randomToken() { const a = new Uint8Array(32); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); }
async function createAndSendVerification(user, name) {
  const token = randomToken();
  await db.collection('emailVerifications').doc(token).set({ uid: user.uid, email: user.email, verified: false, createdAt: TS(), expiresAt: Date.now() + 24 * 3600 * 1000 });
  const base = location.origin;
  const link = base + '/verify?token=' + token;
  try { await sendVerifyEmail(user.email, name, link); return 'emailjs'; }
  catch (e) {
    if (e.message !== 'EMAILJS_NOT_CONFIGURED') throw e;
    await user.sendEmailVerification({ url: base + '/verify?native=1' }); // fallback: Firebase's own mail
    return 'firebase';
  }
}

/* ── top bar account button ── */
function initNavAccount(sel) {
  const el = document.querySelector(sel || '#navAccount'); if (!el) return;
  auth.onAuthStateChanged(async user => {
    if (!user) { el.className = 'nav-account'; el.href = '/login'; el.textContent = 'Sign In'; return; }
    let name = user.displayName || user.email.split('@')[0], photo = user.photoURL;
    try { const d = await db.collection('users').doc(user.uid).get(); if (d.exists) { name = d.data().displayName || name; photo = d.data().photoURL || photo; } } catch (_) {}
    el.className = 'nav-account signed-in'; el.href = '/account'; el.title = 'Your account';
    el.innerHTML = (photo ? `<img src="${esc(photo)}" alt="">` : `<span class="nav-initial">${esc(name.charAt(0).toUpperCase())}</span>`) + esc(name.split(' ')[0]);
  });
}
const GOOGLE_SVG = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z" fill="#EA4335"/></svg>';
const HEAD_LIBS = '';
</script>
<script>

const $ = id => document.getElementById(id);
const FIELDS = [['subject','Subject','text'],['message','Message','area'],['serviceId','Service ID (optional — different EmailJS account)','text','Leave blank to use default account'],['templateId','Template ID (optional override)','text','Leave blank to use default'],['publicKey','Public Key (optional — different EmailJS account)','text','Leave blank to use default account']];
function fieldHtml(path, label, type, ph) {
  const inner = type === 'area' ? `<textarea data-path="${path}" placeholder="${ph||''}"></textarea>` : `<input type="text" data-path="${path}" placeholder="${ph||''}">`;
  return `<div class="field"><label>${label}</label>${inner}</div>`;
}
function card(title, color, prefix, flat) {
  return `<div class="settings-group"><h3 ${color ? `style="color:var(--${color})"` : ''}>${title}</h3>` +
    FIELDS.map(([k, l, t, ph]) => fieldHtml(flat ? prefix + k.charAt(0).toUpperCase() + k.slice(1) : prefix + '.' + k, l, t, ph)).join('') + '</div>';
}
$('g-account').innerHTML = '<h3>Account credentials</h3>' +
  fieldHtml('emailjsServiceId', 'Service ID', 'text', 'service_xxxxxxx') + fieldHtml('emailjsTemplateId', 'Default Template ID', 'text', 'template_xxxxxxx') + fieldHtml('emailjsPublicKey', 'Public Key', 'text', 'Public key from EmailJS account');
$('g-status').innerHTML = [['pending', 'Pending', 'yellow'], ['confirmed', 'Confirmed', 'teal'], ['shipped', 'Shipped', 'green'], ['cancelled', 'Cancelled', 'red']].map(([k, t, c]) => card(t, c, 'statusEmails.' + k)).join('');
$('g-launch').innerHTML = card('Launch email', '', 'launchEmail', true);
$('g-otp').innerHTML = card('OTP email', '', 'otpEmail');
$('g-verify').innerHTML = card('Verification email', '', 'verifyEmail');

/* launch uses flat keys: launchEmailSubject, launchEmailMessage, launchEmailServiceId, ... */
const STATUS_DEFAULTS = {
  confirmed: { subject: "Your SafeFlame AI order is Confirmed!", message: "Hi {{name}}, good news — your order {{order_id}} for {{tier}} (x{{quantity}}) has been Confirmed! Total: {{total_price}}. We'll notify you again when it ships." },
  shipped: { subject: "Your SafeFlame AI order has Shipped!", message: "Hi {{name}}, your order {{order_id}} has shipped! Thanks for your patience!" },
  cancelled: { subject: "Your SafeFlame AI order was Cancelled", message: "Hi {{name}}, your order {{order_id}} has been Cancelled. If this wasn't expected, please reply to this email and we'll sort it out." }
};
const LAUNCH_DEFAULTS = { launchEmailSubject: "SafeFlame AI has launched!", launchEmailMessage: "Great news — SafeFlame AI is officially live! Thank you for joining our waitlist. Visit the site to pre-book your unit before the launch offer ends." };

const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
function setPath(o, p, v) { const ks = p.split('.'); let c = o; ks.slice(0, -1).forEach(k => c = c[k] = c[k] || {}); c[ks[ks.length - 1]] = v; }

function fill(s) {
  document.querySelectorAll('[data-path]').forEach(el => {
    const p = el.dataset.path; let v = getPath(s, p);
    if (v == null || v === '') { const m = p.match(/^statusEmails\.(\w+)\.(subject|message)$/); v = m && STATUS_DEFAULTS[m[1]] ? STATUS_DEFAULTS[m[1]][m[2]] : (LAUNCH_DEFAULTS[p] || ''); }
    el.value = v == null ? '' : v;
  });
}
function collect() {
  const out = {};
  document.querySelectorAll('[data-path]').forEach(el => setPath(out, el.dataset.path, el.value.trim()));
  return out;
}

/* ── autosave ── */
const chip = $('autosaveChip');
let timer = null, loaded = false;
async function save() {
  chip.className = ''; chip.textContent = 'Saving…';
  try { await db.collection('settings').doc('site').set(collect(), { merge: true }); chip.className = 'ok'; chip.textContent = 'Saved'; setTimeout(() => { if (chip.textContent === 'Saved') chip.textContent = ''; }, 2200); }
  catch (e) { console.error(e); chip.className = 'err'; chip.textContent = 'Could not save'; }
}
function queue() { if (!loaded) return; chip.className = ''; chip.textContent = 'Saving…'; clearTimeout(timer); timer = setTimeout(save, 700); }
document.addEventListener('input', e => { if (e.target.matches('[data-path]')) queue(); });
window.addEventListener('beforeunload', () => { if (timer) { clearTimeout(timer); save(); } });

/* tabs */
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); $('tab-' + b.dataset.tab).classList.add('active');
  history.replaceState(null, '', '#' + b.dataset.tab);
}));
const h = location.hash.slice(1); if (h && document.querySelector(`.tab-btn[data-tab="${h}"]`)) document.querySelector(`.tab-btn[data-tab="${h}"]`).click();

let started = false;
auth.onAuthStateChanged(async u => {
  if (!u || !ADMIN_EMAILS.includes(String(u.email || '').toLowerCase())) { location.replace('/admin/'); return; }
  if (started) return; started = true;
  await loadSiteSettings();
  fill(siteSettings);
  loaded = true; chip.textContent = '';
});
</script>
</body>
